<!doctype html>
<html
  lang="en"
  class="page"
>
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0"
    />
    <meta
      http-equiv="X-UA-Compatible"
      content="ie=edge"
    />
    <title>Document</title>
    <link
      rel="stylesheet"
      href="style.css"
    />
  </head>

  <body class="page__body">
    <form
      class="search-bar search-bar--big page__input"
      action="#"
      method="get"
      data-qa="big"
    >
      <div class="search-bar__logo search-bar__logo--big"></div>

      <input
        class="search-bar__input search-bar__input--big"
        type="text"
        name="query"
        data-qa="keypress"
        placeholder="Try “Los Angeles“"
      />
    </form>

    <form
      class="search-bar search-bar--small page__input"
      action="#"
      method="get"
      data-qa="small"
    >
      <div class="search-bar__logo search-bar__logo--small"></div>

      <input
        class="search-bar__input search-bar__input--small"
        type="text"
        name="query"
        data-qa="hover"
        placeholder="Try “Los Angeles“"
      />
    </form>
  </body>
</html>
